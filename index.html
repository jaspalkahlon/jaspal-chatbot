<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#052542"/>
  <title>Prodify Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: 'Inter', sans-serif;
      background: #e5ddd5;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #chat-container {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      max-height: 100vh;
      background: #fff;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #ccc;
      border-right: 1px solid #ccc;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
    }

    .msg {
      max-width: 75%;
      padding: 10px 14px;
      margin: 4px 0;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background: #dcf8c6;
      color: #000;
    }

    .bot {
      align-self: flex-start;
      background: #eeeeee;
      color: #111;
      border: 1px solid #ccc;
    }

    .bot strong {
      color: #333;
    }

    #input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ccc;
      background: #f0f0f0;
    }

    #input {
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #a5c0df;
      border-radius: 20px;
    }

    #send {
      margin-left: 8px;
      padding: 0 16px;
      border: none;
      border-radius: 20px;
      background: #052542;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    form#lead-form {
      background: #fff;
      padding: 16px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    form#lead-form input,
    form#lead-form textarea {
      width: 100%;
      margin-bottom: 8px;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    form#lead-form button {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      font-weight: 600;
      background: #28a745;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    @media screen and (max-width: 480px) {
      #chat-container {
        width: 100%;
        height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div id="chat-container">
    <div id="messages"></div>
    <div id="input-area">
      <input id="input" placeholder="Type a message…" autocomplete="off" disabled />
      <button id="send" disabled>Send</button>
    </div>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    const BASE_URL = window.location.hostname.includes("localhost")
      ? "http://localhost:8000"
      : "https://prodifyteam-chatbot.onrender.com"; // ✅ Your live backend endpoint

    let sessionId = sessionStorage.getItem("session_id");
    if (!sessionId) {
      sessionId = crypto.randomUUID();
      sessionStorage.setItem("session_id", sessionId);
    }

    function addMessage(text, cls = 'bot') {
      const d = document.createElement('div');
      d.className = `msg ${cls}`;

      let formatted = text;

      if (text.includes("✅ What to focus on:")) {
        const parts = text.split("✅ What to focus on:");
        const bullets = parts[1]
          .split('\n')
          .filter(line => line.trim() !== '')
          .map((line, i) => `${i + 1}. ${line.replace(/^[-•]\s*/, '')}`)
          .join('<br/>');
        formatted = `${parts[0]}<br/><br/><strong>✅ What to focus on:</strong><br/>${bullets}`;
      }

      d.innerHTML = formatted;
      messages.appendChild(d);
      messages.scrollTop = messages.scrollHeight;
    }

    function showLeadForm() {
      const html = `
        <form id="lead-form">
          <input id="lead-name" type="text" placeholder="Your Name" required />
          <input id="lead-email" type="email" placeholder="Your Email" required />
          <textarea id="lead-details" rows="3" placeholder="Describe what you need" required></textarea>
          <button type="submit">Submit</button>
        </form>`;
      messages.insertAdjacentHTML('beforeend', html);
      document.getElementById('lead-form').onsubmit = submitLeadForm;
    }

    async function submitLeadForm(e) {
      e.preventDefault();
      const name = document.getElementById('lead-name').value.trim();
      const email = document.getElementById('lead-email').value.trim();
      const details = document.getElementById('lead-details').value.trim();

      const status = document.createElement('div');
      status.className = 'msg bot';
      status.innerHTML = "Submitting your details...";
      messages.appendChild(status);
      messages.scrollTop = messages.scrollHeight;

      try {
        await fetch(`${BASE_URL}/lead`, {
          method: "POST",
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, name, email, details })
        });
      } catch (err) {
        addMessage("⚠️ Couldn't connect to server. Please try again.");
        return;
      }

      document.getElementById('lead-form').remove();
      status.remove();
      inputEl.disabled = false;
      sendBtn.disabled = false;
      addMessage("Thanks! Now tell me a challenge in your business and I’ll try helping you solve it.");
    }

    function startChat() {
      sendBtn.addEventListener('click', sendMessage);
      inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      inputEl.value = '';
      try {
        const res = await fetch(`${BASE_URL}/chat`, {
          method: "POST",
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, message: text })
        });
        const { reply } = await res.json();
        addMessage(reply);
      } catch (err) {
        console.error("Fetch error:", err);
        addMessage("⚠️ Couldn't connect to server. Please try again.");
      }
    }

    function handleLanguage(lang) {
      addMessage(`<strong>${lang}</strong>`, 'user');
      addMessage("Great! Let's learn more about you.");
      showLeadForm();
    }

    addMessage(`
      <p><strong>Please select your language:</strong></p>
      <button onclick="handleLanguage('English')">English</button>
      <button onclick="handleLanguage('हिन्दी')">हिन्दी</button>
    `);

    startChat();
  </script>
</body>
</html>
